<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binario 4 - Testi</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #f5f5f5;
            --accent-yellow: #ffe600;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            padding: 100px 40px;
        }

        #custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: var(--accent-yellow);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
        }

        h1 {
            color: var(--accent-yellow);
            margin-bottom: 30px;
        }

        .song-list {
            list-style: none;
        }

        .song-item {
            padding: 20px;
            border-bottom: 1px solid #333;
            font-size: 1.5rem;
            display: flex;
            justify-content: space-between;
            transition: background 0.2s;
        }

        .song-item:hover {
            background-color: #1a1a1a;
            color: var(--accent-yellow);
        }
    </style>
</head>
<body>

    <div id="custom-cursor"></div>

    <h1>Raccolta Testi</h1>

    <ul class="song-list">
        <li class="song-item"><span>01. Stazione Centrale</span> <span>3:45</span></li>
        <li class="song-item"><span>02. Notte di Metallo</span> <span>4:12</span></li>
        <li class="song-item"><span>03. Ultima Corsa</span> <span>5:01</span></li>
    </ul>

    <script>
        const cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        /* Micro-suono Web Audio API */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playPaperSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        document.querySelectorAll('.song-item').forEach(item => {
            item.addEventListener('mouseenter', () => {
                playPaperSound();
            });
        });
    </script>
</body>
</html>
