<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binario 4 - Chi Siamo</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #f5f5f5;
            --accent-yellow: #ffe600;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            padding: 100px 40px 40px 40px;
        }

        /* Custom Cursor Torcia/Lente */
        #lens-cursor {
            position: fixed;
            width: 80px;
            height: 80px;
            border: 2px solid var(--accent-yellow);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            box-shadow: 0 0 15px rgba(255, 230, 0, 0.4);
            transition: transform 0.05s ease-out;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 40px;
            color: var(--accent-yellow);
        }

        .grid-polaroid {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Card Polaroid 3D */
        .polaroid {
            width: 260px;
            background-color: #fff;
            color: #111;
            padding: 15px 15px 25px 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .polaroid-img-container {
            width: 100%;
            height: 240px;
            background-color: #333;
            position: relative;
            overflow: hidden;
        }

        /* Immagine Grigia di base, a colori con l'effetto Lens */
        .polaroid-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            transition: filter 0.3s;
        }

        .polaroid:hover .polaroid-img {
            filter: grayscale(0%);
        }

        .polaroid-caption {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.2/vanilla-tilt.min.js"></script>
</head>
<body>

    <div id="lens-cursor"></div>

    <h1>Formazione della Band</h1>

    <div class="grid-polaroid">
        <div class="polaroid" data-tilt data-tilt-max="20" data-tilt-speed="400">
            <div class="polaroid-img-container">
                <div class="polaroid-img" style="background: #444; height:100%; display:flex; align-items:center; justify-content:center; color:#fff;">FOTO 1</div>
            </div>
            <div class="polaroid-caption">Marco - Voce</div>
        </div>

        <div class="polaroid" data-tilt data-tilt-max="20" data-tilt-speed="400">
            <div class="polaroid-img-container">
                <div class="polaroid-img" style="background: #555; height:100%; display:flex; align-items:center; justify-content:center; color:#fff;">FOTO 2</div>
            </div>
            <div class="polaroid-caption">Luca - Chitarra</div>
        </div>

        <div class="polaroid" data-tilt data-tilt-max="20" data-tilt-speed="400">
            <div class="polaroid-img-container">
                <div class="polaroid-img" style="background: #666; height:100%; display:flex; align-items:center; justify-content:center; color:#fff;">FOTO 3</div>
            </div>
            <div class="polaroid-caption">Sara - Basso</div>
        </div>
    </div>

    <script>
        const lens = document.getElementById('lens-cursor');
        document.addEventListener('mousemove', (e) => {
            lens.style.left = e.clientX + 'px';
            lens.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
