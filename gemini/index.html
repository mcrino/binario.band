<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binario 4 - Home</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #f5f5f5;
            --accent-yellow: #ffe600;
            --accent-dark: #1a1a1a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: none; /* Cursore personalizzato attivato */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
        }

        /* Custom Cursor */
        #custom-cursor {
            position: fixed;
            width: 24px;
            height: 24px;
            border: 2px solid var(--accent-yellow);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease, width 0.2s, height 0.2s, background-color 0.2s;
            z-index: 9999;
            mix-blend-mode: difference;
        }

        #custom-cursor.hover {
            width: 50px;
            height: 50px;
            background-color: rgba(255, 230, 0, 0.3);
        }

        /* Header e Navigazione */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(13,13,13,0.9), transparent);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-yellow);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            margin-left: 30px;
            font-size: 1.1rem;
            position: relative;
            padding-bottom: 5px;
        }

        /* Sottolineature Evidenziatore Live (SVG) */
        .highlight-link {
            position: relative;
            display: inline-block;
        }

        .highlight-link svg {
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 8px;
            pointer-events: none;
        }

        .highlight-link path {
            fill: none;
            stroke: var(--accent-yellow);
            stroke-width: 6;
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            transition: stroke-dashoffset 0.4s ease-in-out;
        }

        .highlight-link:hover path {
            stroke-dashoffset: 0;
        }

        /* Controlli Audio Mute */
        .audio-toggle {
            background: transparent;
            border: 1px solid var(--accent-yellow);
            color: var(--accent-yellow);
            padding: 6px 12px;
            border-radius: 4px;
            font-family: inherit;
        }

        /* Hero Section 3D Canvas */
        .hero {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #canvas-3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            pointer-events: none;
        }

        .hero-title {
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            margin-bottom: 20px;
        }

        .hero-subtitle {
            font-size: 1.5rem;
            color: var(--accent-yellow);
            background: #000;
            padding: 5px 15px;
            display: inline-block;
        }

        /* Sezione Interattiva (Biglietto e Polaroid 3D) */
        .interactive-section {
            position: relative;
            z-index: 2;
            padding: 100px 40px;
            display: flex;
            justify-content: center;
            gap: 50px;
            flex-wrap: wrap;
            background: var(--accent-dark);
        }

        .ticket-card {
            width: 300px;
            height: 180px;
            background: #262626;
            border: 2px dashed var(--accent-yellow);
            border-radius: 8px;
            padding: 20px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .ticket-card .stamp {
            position: absolute;
            right: 20px;
            bottom: 20px;
            border: 3px solid #ff3333;
            color: #ff3333;
            padding: 5px 10px;
            font-weight: bold;
            text-transform: uppercase;
            transform: scale(0) rotate(-15deg);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .ticket-card.stamped .stamp {
            transform: scale(1) rotate(-15deg);
        }
    </style>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Vanilla Tilt per effetto 3D Card -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.2/vanilla-tilt.min.js"></script>
</head>
<body>

    <div id="custom-cursor"></div>

    <header>
        <div class="logo">Binario 4</div>
        <nav>
            <a href="index.html" class="highlight-link">
                Home
                <svg viewBox="0 0 100 20"><path d="M5 15 Q 50 5 95 15"/></svg>
            </a>
            <a href="chi-siamo.html" class="highlight-link">
                Chi Siamo
                <svg viewBox="0 0 100 20"><path d="M5 15 Q 50 5 95 15"/></svg>
            </a>
            <a href="testi.html" class="highlight-link">
                Testi
                <svg viewBox="0 0 100 20"><path d="M5 15 Q 50 5 95 15"/></svg>
            </a>
            <button class="audio-toggle" id="audioToggle">Audio: ON</button>
        </nav>
    </header>

    <section class="hero">
        <canvas id="canvas-3d"></canvas>
        <div class="hero-content">
            <h1 class="hero-title">Prossima Fermata</h1>
            <div class="hero-subtitle">Musica in Viaggio</div>
        </div>
    </section>

    <section class="interactive-section">
        <!-- Biglietto Interattivo -->
        <div class="ticket-card" data-tilt data-tilt-max="25" id="trainTicket">
            <h3>BIGLIETTO TRENO</h3>
            <p style="margin-top: 10px; color: #aaa;">Destinazione: Binario 4</p>
            <p style="margin-top: 5px; font-size: 0.8rem;">[Clicca per timbrare]</p>
            <div class="stamp" id="ticketStamp">CONVALIDATO</div>
        </div>
    </section>

    <script>
        /* --- Web Audio API Synth (Senza risorse esterne) --- */
        let audioEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playClickSound() {
            if (!audioEnabled) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playStampSound() {
            if (!audioEnabled) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(80, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        document.getElementById('audioToggle').addEventListener('click', (e) => {
            audioEnabled = !audioEnabled;
            e.target.innerText = audioEnabled ? 'Audio: ON' : 'Audio: OFF';
        });

        /* --- Custom Cursor --- */
        const cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.querySelectorAll('a, button, .ticket-card').forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
            el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
        });

        /* --- Timbratura Biglietto --- */
        const ticket = document.getElementById('trainTicket');
        ticket.addEventListener('click', () => {
            ticket.classList.toggle('stamped');
            playStampSound();
        });

        /* --- Scene 3D: Binario Infinito (Three.js) --- */
        const canvas = document.getElementById('canvas-3d');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0d0d0d, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Creazione Binario (Wireframe vector nero e giallo)
        const trackGroup = new THREE.Group();
        const railMaterial = new THREE.LineBasicMaterial({ color: 0xffe600 });
        const sleeperMaterial = new THREE.LineBasicMaterial({ color: 0x444444 });

        const railLength = 200;
        
        // Rotaia Sinistra e Destra
        const leftRailGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-1.5, 0, 0), new THREE.Vector3(-1.5, 0, -railLength)]);
        const rightRailGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(1.5, 0, 0), new THREE.Vector3(1.5, 0, -railLength)]);
        trackGroup.add(new THREE.Line(leftRailGeo, railMaterial));
        trackGroup.add(new THREE.Line(rightRailGeo, railMaterial));

        // Traverse del binario
        for (let z = 0; z > -railLength; z -= 2) {
            const sleeperGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-2, -0.1, z), new THREE.Vector3(2, -0.1, z)]);
            trackGroup.add(new THREE.Line(sleeperGeo, sleeperMaterial));
        }

        scene.add(trackGroup);

        // Movimento continuo del binario
        let speed = 0.2;
        function animate() {
            requestAnimationFrame(animate);
            trackGroup.position.z += speed;
            if (trackGroup.position.z > 2) {
                trackGroup.position.z = 0;
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
