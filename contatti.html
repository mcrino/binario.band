<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatti - BINARIO</title>
    <meta name="description" content="Contatta i BINARIO per concerti, booking, interviste o un saluto. La band indie/rock fiorentina risponde direttamente qui.">
    
    <!-- Meta Tag Social (Open Graph) -->
    <meta property="og:title" content="Contatti - BINARIO">
    <meta property="og:description" content="Vuoi portarci a suonare nel tuo locale o evento? Scrivici direttamente dal sito!">
    <meta property="og:image" content="https://binario.band/img/band.png">
    <meta property="og:url" content="https://binario.band/contatti.html">
    <meta property="og:type" content="website">

    <link rel="icon" type="image/png" href="img/favicon.png">
    
    <style>
        :root {
            --bg-color: #12100e;
            --text-color: #f5eedc;
            --accent-color: #fdecc5;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(253, 236, 197, 0.2);
        }
        /* --- NAVBAR GLOBALE BINARIO --- */
        .main-nav {
            background-color: rgba(18, 16, 14, 0.95);
            border-bottom: 1px solid rgba(253, 236, 197, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(5px); /* Effetto sfocato elegante allo scorrimento */
        }

        .nav-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo img {
            height: 30px;
            width: auto;
            vertical-align: middle;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .nav-link-item {
            color: #f5eedc;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.25s ease;
        }

        .nav-link-item:hover,
        .nav-link-item.active {
            color: #fdecc5;
            border-bottom: 2px solid #fdecc5;
        }

        /* Tasto Menu Hamburger (Mobile) */
        .nav-toggle {
            display: none;
            background: none;
            border: none;
            color: #fdecc5;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Responsive per Smartphone */
        @media (max-width: 680px) {
            .nav-toggle {
                display: block;
            }

            .nav-menu {
                display: none;
                flex-direction: column;
                width: 100%;
                position: absolute;
                top: 100%;
                left: 0;
                background-color: #12100e;
                border-bottom: 1px solid rgba(253, 236, 197, 0.2);
                padding: 15px 20px;
                gap: 15px;
            }

            .nav-menu.active {
                display: flex;
            }
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 30px 20px 10px;
        }

        .logo-container img {
            width: 280px;
            height: auto;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
        }

        .nav-link {
            display: inline-block;
            margin-bottom: 25px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }

        .nav-link:hover {
            text-decoration: underline;
        }

        .page-title {
            font-size: 2rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .intro-text {
            color: #bfae93;
            margin-bottom: 30px;
            font-size: 1.05rem;
        }

        /* --- STILI DEL FORM --- */
        .contact-form {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent-color);
            font-weight: bold;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--accent-color);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--accent-color);
            color: #12100e;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #fff8e7;
            transform: translateY(-2px);
        }

        footer {
            margin-top: auto;
            text-align: center;
            padding: 30px;
            color: #777;
            font-size: 0.85rem;
        }

        footer a {
            color: var(--accent-color);
            text-decoration: none;
        }
    </style>

    <!-- SEO Schema.org per il form contatti / band -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MusicGroup",
      "name": "BINARIO",
      "url": "https://binario.band",
      "email": "info@binario.band",
      "sameAs": [
        "https://instagram.com/binario_band",
        "https://www.youtube.com/@binario_band3762",
        "https://www.facebook.com/binaro.band"
      ]
    }
    </script>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="main-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="img/logo-trasp.png" alt="BINARIO Logo">
            </a>
            
            <button class="nav-toggle" id="navToggle" aria-label="Apri Menu">
                ☰
            </button>

            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link-item">Home</a></li>
                <li><a href="chi-siamo.html" class="nav-link-item">Chi Siamo</a></li>
                <li><a href="testi.html" class="nav-link-item">Testi</a></li>
                <li><a href="contatti.html" class="nav-link-item">Contatti</a></li>
            </ul>
        </div>
    </nav>
    <header>
        <div class="logo-container">
            <a href="index.html"><img src="img/logo.png" alt="BINARIO Logo"></a>
        </div>
    </header>

    <div class="container">

        <a href="index.html" class="nav-link">&larr; Torna alla Home</a>

        <h1 class="page-title">Scrivici</h1>
        
        <p class="intro-text">
            Vuoi organizzare un live, proporci una data, inviarci un'ingiunzione di pagamento o semplicemente dirci quanto la musica indie sia sopravvalutata? Compila il form qui sotto.
        </p>

        <!-- SOSTITUISCI 'TUO_ENDPOINT_FORMSPREE' CON IL TUO ID DI FORMSPREE -->
        <form class="contact-form" action="https://formspree.io/f/xgogrqlk" method="POST">
            
            <div class="form-group">
                <label for="name">Il tuo Nome / Nome del Locale</label>
                <input type="text" id="name" name="name" placeholder="Es. Mario Rossi / Circolo ARCI" required>
            </div>

            <div class="form-group">
                <label for="email">Indirizzo Email</label>
                <input type="email" id="email" name="email" placeholder="nome@esempio.it" required>
            </div>

            <div class="form-group">
                <label for="motive">Motivo del contatto</label>
                <select id="motive" name="motive">
                    <option value="Booking / Concerto">Booking / Proposta Concerto</option>
                    <option value="Stampa / Intervista">Ufficio Stampa / Intervista</option>
                    <option value="Un saluto">Un saluto / Opinione</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Messaggio</label>
                <textarea id="message" name="message" rows="5" placeholder="Scrivi qui il tuo messaggio..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Invia Messaggio &rarr;</button>

        </form>

    </div>

    <footer>
        <p>&copy; 2026 BINARIO • <a href="privacy.html">Privacy Policy</a></p>
    </footer>
    <script>
        const navToggle = document.getElementById('navToggle');
        const navMenu = document.getElementById('navMenu');

        if (navToggle && navMenu) {
            navToggle.addEventListener('click', () => {
                navMenu.classList.toggle('active');
            });
        }
    </script>
</body>
</html>
